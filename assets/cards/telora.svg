<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="590" height="377" viewBox="0 0 590 377" role="img" aria-labelledby="t d">
  <title id="t">Telora</title>
  <desc id="d">Cellular calls and SMS through your own Android phones, run from one backend and one dashboard. SMS over an authenticated device WebSocket with delivery acks. Inbound messages are buffered and replayed if the link drops. Voice over SIP through Asterisk ARI, and the handset places the real cellular call. Speech-to-text → LLM → text-to-speech pipeline for automated calls. API keys are stored only as SHA-256 hashes.</desc>
