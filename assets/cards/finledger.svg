<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="590" height="377" viewBox="0 0 590 377" role="img" aria-labelledby="t d">
  <title id="t">FinLedger</title>
  <desc id="d">Borrowers, loans, monthly interest and collections for a small lending business. Generates monthly interest due dates and applies each payment to the oldest pending interest first (FIFO), so the user only enters an amount. Dashboard for due-today, overdue and next-7-days items, plus a due-date calendar, browser notifications and Excel export. One Docker Compose command runs PostgreSQL, the API and the Nginx-served frontend.</desc>
