    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1c2840" stroke-width="1"/></pattern>
    <clipPath id="frame"><rect width="590" height="186" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="590" height="186" fill="url(#bg)"/>
    <rect width="590" height="186" fill="url(#grid)" opacity="0.6"/>
  </g>
