<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="590" height="186" viewBox="0 0 590 186" role="img" aria-labelledby="t d">
  <title id="t">Chat-trace</title>
  <desc id="d">A Chrome extension that records which ChatGPT answer prompted each follow-up question, so you can jump back to it. </desc>
  <defs>
