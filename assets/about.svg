<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="455" viewBox="0 0 1200 455" role="img" aria-labelledby="t d">
  <title id="t">What I work on</title>
  <desc id="d">I build the plumbing: Android phones that work as SMS and call gateways, browser tools that plug into apps people already use, and the backends that hold it all together. Most of my projects are full systems, with a mobile client, an API, a dashboard and deployment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111a2e"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1c2840" stroke-width="1"/></pattern>
    <clipPath id="frame"><rect width="1200" height="455" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="455" fill="url(#bg)"/>
    <rect width="1200" height="455" fill="url(#grid)" opacity="0.6"/>
  </g>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><g><animate attributeName="opacity" from="0" to="0" dur="0.20s"/><animateTransform attributeName="transform" type="translate" values="0 14;0 0" dur="0.5s" begin="0.20s" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.3 1"/><animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.20s"/><text x="40" y="50" fill="#e2e8f0" font-size="17"><tspan>I build the plumbing: Android phones that work as SMS and call gateways, browser tools that plug into apps</tspan></text><text x="40" y="77" fill="#e2e8f0" font-size="17"><tspan>people already use, and the backends that hold it all together. Most of my projects are full systems, with a</tspan></text><text x="40" y="104" fill="#e2e8f0" font-size="17"><tspan>mobile client, an API, a dashboard and deployment.</tspan></text></g><g><animate attributeName="opacity" from="0" to="0" dur="0.70s"/><animateTransform attributeName="transform" type="translate" values="0 0;0 0" dur="0.5s" begin="0.70s" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.3 1"/><animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.70s"/><g><animateTransform attributeName="transform" type="translate" values="-24 0;0 0" dur="0.5s" begin="0.70s" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.3 1"/><rect x="40" y="137" width="4" height="44" rx="2" fill="#34d399"/><text x="60" y="153" fill="#34d399" font-size="16" font-weight="700">Telephony and messaging</text><text x="60" y="177" fill="#94a3b8" font-size="15">Routing real cellular calls and SMS through Android handsets, with Asterisk, SIP and WebSockets in between.</text><circle cx="1152" cy="149" r="4" fill="#34d399"/><circle cx="1152" cy="149" r="4" fill="none" stroke="#34d399" stroke-width="1.5"><animate attributeName="r" values="4;12" dur="2s" begin="-0.00s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.8;0" dur="2s" begin="-0.00s" repeatCount="indefinite"/></circle></g></g><g><animate attributeName="opacity" from="0" to="0" dur="1.05s"/><animateTransform attributeName="transform" type="translate" values="0 0;0 0" dur="0.5s" begin="1.05s" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.3 1"/><animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.05s"/><g><animateTransform attributeName="transform" type="translate" values="-24 0;0 0" dur="0.5s" begin="1.05s" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.3 1"/><rect x="40" y="207" width="4" height="44" rx="2" fill="#38bdf8"/><text x="60" y="223" fill="#38bdf8" font-size="16" font-weight="700">Browser automation and extensions</text><text x="60" y="247" fill="#94a3b8" font-size="15">Manifest V3 extensions and Playwright/CDP tooling that work with existing web apps.</text><circle cx="1152" cy="219" r="4" fill="#38bdf8"/><circle cx="1152" cy="219" r="4" fill="none" stroke="#38bdf8" stroke-width="1.5"><animate attributeName="r" values="4;12" dur="2s" begin="-0.50s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.8;0" dur="2s" begin="-0.50s" repeatCount="indefinite"/></circle></g></g><g><animate attributeName="opacity" from="0" to="0" dur="1.40s"/><animateTransform attributeName="transform" type="translate" values="0 0;0 0" dur="0.5s" begin="1.40s" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.3 1"/><animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.40s"/><g><animateTransform attributeName="transform" type="translate" values="-24 0;0 0" dur="0.5s" begin="1.40s" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.3 1"/><rect x="40" y="277" width="4" height="66" rx="2" fill="#a78bfa"/><text x="60" y="293" fill="#a78bfa" font-size="16" font-weight="700">Applied ML and AI</text><text x="60" y="317" fill="#94a3b8" font-size="15">URL-based phishing detection with classical and deep models, and speech-to-text, LLM and text-to-speech pipelines in</text><text x="60" y="339" fill="#94a3b8" font-size="15">production-style backends.</text><circle cx="1152" cy="289" r="4" fill="#a78bfa"/><circle cx="1152" cy="289" r="4" fill="none" stroke="#a78bfa" stroke-width="1.5"><animate attributeName="r" values="4;12" dur="2s" begin="-1.00s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.8;0" dur="2s" begin="-1.00s" repeatCount="indefinite"/></circle></g></g><g><animate attributeName="opacity" from="0" to="0" dur="1.75s"/><animateTransform attributeName="transform" type="translate" values="0 0;0 0" dur="0.5s" begin="1.75s" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.3 1"/><animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.75s"/><g><animateTransform attributeName="transform" type="translate" values="-24 0;0 0" dur="0.5s" begin="1.75s" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.3 1"/><rect x="40" y="369" width="4" height="44" rx="2" fill="#fbbf24"/><text x="60" y="385" fill="#fbbf24" font-size="16" font-weight="700">Current focus</text><text x="60" y="409" fill="#94a3b8" font-size="15">Extending Telora and prototyping HistoWay, a travel companion that narrates the history of places as you pass them.</text><circle cx="1152" cy="381" r="4" fill="#fbbf24"/><circle cx="1152" cy="381" r="4" fill="none" stroke="#fbbf24" stroke-width="1.5"><animate attributeName="r" values="4;12" dur="2s" begin="-1.50s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.8;0" dur="2s" begin="-1.50s" repeatCount="indefinite"/></circle></g></g></g>
  <rect x="1" y="1" width="1198" height="453" rx="15" fill="none" stroke="#1e3a5f" stroke-width="1.5"/><rect x="1" y="1" width="1198" height="453" rx="15" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="396 2906" stroke-linecap="round"><animate attributeName="stroke-dashoffset" values="0;-3302" dur="9s" begin="-0.00s" repeatCount="indefinite"/></rect>
</svg>
