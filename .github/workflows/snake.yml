name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#7c3aed
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#38bdf8

      - name: Publish to output branch
        run: |
          # snk runs in Docker and leaves dist/ owned by root, so publish from a copy
          cp -r dist "$RUNNER_TEMP/out" && cd "$RUNNER_TEMP/out"
          git init -q -b output
          git add .
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Update contribution snake"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" output
